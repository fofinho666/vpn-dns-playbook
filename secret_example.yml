---
host: <server ip address>
ssh_port: <ssh port>
user: <server user>
ansible_ssh_pass: <ssh password>
domain: <namecheap domain>
headscale_subdomain: <obscure random subdomain for the headscale control plane, e.g. openssl rand -hex 6>
webssh_subdomain: <subdomain for the rescue shell, e.g. oops>
authelia_password: <2fa password>
jwt_secret: <secret> # run "$ openssl rand -hex 23"
session_secret: <secret> # run "$ openssl rand -hex 23"
storage_encryption_key: <secret> # run "$ openssl rand -hex 23"
smtp_host: <SMTP server, e.g. smtp.gmail.com>
smtp_port: <SMTP port, e.g. 587>
smtp_username: <SMTP username, usually the full email address>
smtp_password: <SMTP password — for Gmail use an App Password, not your account password>
smtp_sender: <From address, e.g. you@gmail.com>
cloudflare_api_token: <API token with Zone:DNS:Edit permission>
headscale_api_key: "<api key — generate with: docker exec headscale headscale apikeys create>"
tailscale_preauth_key: "<preauth key — generate with: docker exec headscale headscale preauthkeys create --user USER --reusable>"

# VPS relay — Oracle Cloud free tier ARM VM (raw-TCP socat relay for all public HTTPS traffic)
vps_host: <vps public ip>
vps_user: ubuntu  # default for Oracle Cloud Ubuntu images
vps_ssh_port: 22
local_dns: <LAN DNS server IP, e.g. your router's IP>
