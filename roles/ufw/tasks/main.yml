---
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Allow packet forwarding (required for Tailscale subnet routing)
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: reload ufw

- name: Enable UFW logging
  ufw:
    logging: on

- name: Configure UFW
  block:
    - name: Reset all rules
      ufw:
        state: reset

    - name: Allow the defined ports
      ufw:
        rule: allow
        proto: "{{ item.proto }}"
        port: "{{ item.port }}"
      with_items:
        - "{{ ufw_ports }}"

    - name: Deny everything else and enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Accept loopback traffic
      iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT
        action: insert
        rule_num: 1

    - name: Deploy loopback-fix systemd service
      template:
        src: ufw-loopback-fix.service.j2
        dest: /etc/systemd/system/ufw-loopback-fix.service
        mode: '0644'

    - name: Enable and start loopback-fix service
      systemd:
        name: ufw-loopback-fix
        enabled: yes
        state: started
        daemon_reload: yes

  rescue:
    - name: Grant SSH access to prevent lockout
      ufw:
        rule: allow
        port: "{{ ufw_rescue_port | default(ssh_port) }}"
        proto: "tcp"

    - name: Deny everything else and enable UFW
      ufw:
        state: enabled
        policy: deny