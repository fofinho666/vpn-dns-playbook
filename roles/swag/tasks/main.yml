---
- name: Create the folder
  file:
    path: "{{ docker_dir }}/swag/nginx/{{ item }}"
    state: directory
    recurse: yes
  loop:
    - snippets
    - proxy-confs
    - site-confs

- name: Copy nginx files
  copy:
    src: nginx/
    dest: "{{ docker_dir }}/swag/nginx/"
  
- name: Build and copy templates
  template:
    src: "{{ item }}"
    dest: "{{ docker_dir }}/swag/{{ item }}"
  loop:
    - .env
    - nginx/proxy-confs/auth.subdomain.conf
    - nginx/proxy-confs/portainer.subdomain.conf
    - nginx/proxy-confs/headscale.subdomain.conf
    - nginx/proxy-confs/headplane.subdomain.conf
    - nginx/headplane-init.js
    - nginx/proxy-confs/oops.subdomain.conf
    - nginx/snippets/authelia-authrequest.conf
    - nginx/snippets/authelia-location.conf
    - nginx/site-confs/default.conf

- name: Create dns-conf directory for Cloudflare credentials
  file:
    path: "{{ docker_dir }}/swag/dns-conf"
    state: directory
    mode: "0700"

- name: Copy Cloudflare DNS credentials
  template:
    src: dns-conf/cloudflare.ini.j2
    dest: "{{ docker_dir }}/swag/dns-conf/cloudflare.ini"
    mode: "0600"

- name: Remove old headscale-ui nginx conf
  file:
    path: "{{ docker_dir }}/swag/nginx/proxy-confs/headscale-ui.subdomain.conf"
    state: absent

- name: Make sure SWAG container is created and running
  docker_container:
    name: swag
    image: lscr.io/linuxserver/swag:latest
    networks:
      - name: docker_network
        ipv4_address: "{{ swag.docker_address }}"
    pull: yes
    restart: yes
    state: started
    env_file: "{{ docker_dir }}/swag/.env"
    capabilities:
      - NET_ADMIN
    ports:
      - "{{ http_port }}:80"
      - "{{ https_port }}:443"
    volumes:
      - "{{ docker_dir }}/swag:/config"
    restart_policy: unless-stopped
