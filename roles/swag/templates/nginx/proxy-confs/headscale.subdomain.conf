server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name {{ headscale.subdomain }}.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location = /admin {
        return 302 https://{{ headscale_ui.subdomain }}.{{ domain }}/;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://{{ headscale_ui.subdomain }}.{{ domain }}" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin "https://{{ headscale_ui.subdomain }}.{{ domain }}" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

        proxy_buffering off;

        include /config/nginx/resolver.conf;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_buffers 32 4k;
        proxy_connect_timeout 240;
        proxy_headers_hash_bucket_size 128;
        proxy_headers_hash_max_size 1024;
        proxy_http_version 1.1;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_redirect http:// $scheme://;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Proxy "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        set $upstream_app {{ headscale.forward_host }};
        set $upstream_port {{ headscale.forward_port }};
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
