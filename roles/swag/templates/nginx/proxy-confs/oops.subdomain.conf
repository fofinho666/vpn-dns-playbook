# Oops SSH shell (wetty). Intentionally internet-reachable through the
# Cloudflare Tunnel (it must work when you are remote and locked out of
# normal SSH). It is NOT LAN-restricted. Protection layers:
#   1. Authelia two-factor (wildcard *.{{ domain }} access_control rule)
#   2. The system SSH user + password prompted by wetty itself
server {
    # enable for Authelia
    include /config/nginx/snippets/authelia-location.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name {{ webssh.subdomain }}.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        # NOTE: do NOT add `Clear-Site-Data` here. With `always` on `location /`
        # it is returned on every asset response, disabling all caching and
        # forcing a blocking cache/storage purge in the browser on every load —
        # which made this rescue shell crawl. wetty persists no secret in
        # browser storage (it prompts for the SSH user/pass each connect; the
        # session is a WebSocket), so the wipe bought nothing here. If a
        # wipe-on-exit is ever wanted, scope it to an explicit logout response.

        # enable for Authelia
        include /config/nginx/snippets/authelia-authrequest.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app {{ webssh.forward_host }};
        set $upstream_port {{ webssh.forward_port }};
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
