---
- name: Check if tailscale is installed
  command: which tailscale
  register: _ts_installed
  changed_when: false
  failed_when: false

- name: Install tailscale via official script
  shell: curl -fsSL https://tailscale.com/install.sh | sh
  when: _ts_installed.rc != 0

- name: Enable and start tailscaled
  systemd:
    name: tailscaled
    state: started
    enabled: yes

- name: Check if tailscale is already connected
  command: tailscale status --json
  register: _ts_status
  changed_when: false
  failed_when: false

- name: Connect tailscale to headscale
  command: >
    tailscale up
    --login-server=https://{{ headscale.subdomain }}.{{ domain }}
    --advertise-routes={{ local_ip_range }}
    --advertise-exit-node
    --accept-dns=false
    --auth-key={{ tailscale_preauth_key }}
  when:
    - tailscale_preauth_key is defined
    - (_ts_status.stdout | from_json).BackendState | default('') != 'Running'

- name: Advertise exit node on already-connected tailscale
  command: tailscale set --advertise-exit-node
  changed_when: false
  when: (_ts_status.stdout | from_json).BackendState | default('') == 'Running'

- name: Wait for server node to appear in Headscale
  command: docker exec headscale headscale nodes list --output json
  register: _headscale_nodes
  changed_when: false
  retries: 10
  delay: 3
  until: >
    _headscale_nodes.rc == 0 and
    (_headscale_nodes.stdout | from_json |
     selectattr('given_name', 'equalto', ansible_hostname) | list | length > 0)

- name: Approve advertised routes in Headscale
  command: >
    docker exec headscale headscale nodes approve-routes
    --identifier {{ item.id }}
    --routes {{ local_ip_range }},0.0.0.0/0,::/0
  loop: "{{ _headscale_nodes.stdout | from_json }}"
  when:
    - item.given_name == ansible_hostname
    - >
      local_ip_range not in (item.approved_routes | default([])) or
      '0.0.0.0/0' not in (item.approved_routes | default([]))

# Tailscale masquerades everything it forwards from the subnet route. When the
# destination is a container on this host the packet leaves through the docker
# bridge, so services behind SWAG see the docker gateway instead of the client's
# 100.64.x.x address and their "allow tailscale_ip_range" rule denies it (403).
# Tailscale re-inserts its own NAT jump first whenever it reconfigures, so the
# fix is to let it do no SNAT at all and masquerade ourselves for every
# destination except the docker network (replies to containers route back over
# tailscale0 unchanged).
# IPv4 forwarding currently only survives because docker enables it at start;
# tailscale's own health check flags it. Persist it for both families so the
# subnet router works from boot.
- name: Persist IP forwarding for subnet routing
  sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_set: yes
    state: present
    reload: yes
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Read tailscale prefs
  command: tailscale debug prefs
  register: _ts_prefs
  changed_when: false
  failed_when: false

- name: Disable tailscale's own SNAT for subnet routes
  command: tailscale set --snat-subnet-routes=false
  when: _ts_prefs.rc == 0 and not ((_ts_prefs.stdout | from_json).NoSNAT | default(false))

- name: Masquerade forwarded tailscale traffic ourselves, except into the docker network
  iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ tailscale_ip_range }}"
    destination: "! {{ docker_network_subnet }}"
    out_interface: "! tailscale0"
    jump: MASQUERADE
    comment: tailscale-docker-snat-fix

- name: Deploy the tailscale docker SNAT fix service (re-applied on boot)
  template:
    src: tailscale-docker-snat-fix.service.j2
    dest: /etc/systemd/system/tailscale-docker-snat-fix.service
    mode: '0644'

- name: Enable the tailscale docker SNAT fix service
  systemd:
    name: tailscale-docker-snat-fix
    enabled: yes
    state: started
    daemon_reload: yes
