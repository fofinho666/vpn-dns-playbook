---
- name: Install fail2ban
  apt:
    name: fail2ban
    state: present

- name: Deploy jail.local
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: restart fail2ban

- name: Enable and start fail2ban
  service:
    name: fail2ban
    enabled: yes
    state: started
