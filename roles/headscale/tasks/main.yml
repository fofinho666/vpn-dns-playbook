---
- name: Ensure headscale data directory exists
  file:
    path: "{{ docker_dir }}/headscale"
    state: directory
    mode: '0755'

- name: Deploy headscale config
  template:
    src: config.yaml.j2
    dest: "{{ docker_dir }}/headscale/config.yaml"
    mode: '0644'
  notify: restart headscale

- name: Deploy pinned static DERP map
  copy:
    src: derp.yaml
    dest: "{{ docker_dir }}/headscale/derp.yaml"
    mode: '0644'
  notify: restart headscale

- name: Ensure headplane data directory exists
  file:
    path: "{{ docker_dir }}/headplane"
    state: directory
    mode: '0755'

- name: Deploy headplane config
  template:
    src: headplane-config.yaml.j2
    dest: "{{ docker_dir }}/headplane/config.yaml"
    mode: '0644'
  notify: restart headplane

- name: Make sure the headplane container is created and running
  docker_container:
    name: headplane
    image: ghcr.io/tale/headplane:latest
    pull: yes
    networks:
      - name: docker_network
        ipv4_address: "{{ headplane.docker_address }}"
    volumes:
      - "{{ docker_dir }}/headplane/config.yaml:/etc/headplane/config.yaml:ro"
      - "{{ docker_dir }}/headplane/data:/var/lib/headplane"
      - "{{ docker_dir }}/headscale/config.yaml:/etc/headscale/config.yaml:ro"
    state: started
    restart: yes
    restart_policy: unless-stopped

- name: Make sure the headscale container is created and running
  docker_container:
    name: headscale
    image: headscale/headscale:latest
    pull: yes
    command: serve
    networks:
      - name: docker_network
        ipv4_address: "{{ headscale.docker_address }}"
    volumes:
      - "{{ docker_dir }}/headscale:/var/lib/headscale"
      - "{{ docker_dir }}/headscale/config.yaml:/etc/headscale/config.yaml:ro"
    state: started
    restart: yes
    restart_policy: unless-stopped

- name: Deploy device registration helper script
  template:
    src: register-device.sh.j2
    dest: "{{ docker_dir }}/headscale/register-device.sh"
    mode: '0755'

- name: Add a device registration alias to .bashrc
  blockinfile:
    path: "/home/{{ user }}/.bashrc"
    create: yes
    owner: "{{ uid }}"
    group: "{{ gid }}"
    mode: "0755"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - headscale register_device"
    state: present
    block: |
      alias register_device="{{ docker_dir }}/headscale/register-device.sh"
  notify:
    - Source .bashrc
