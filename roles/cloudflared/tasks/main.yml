---
- name: Decode Cloudflare tunnel token
  set_fact:
    _cf_payload: >-
      {{ cloudflare_tunnel_token
         | regex_replace('^[^.]+\.([^.]+).*$', '\1')
         | replace('-', '+') | replace('_', '/')
         | b64decode | from_json }}

- name: Set tunnel IDs from token
  set_fact:
    _cf_account_id: "{{ _cf_payload.a }}"
    _cf_tunnel_id: "{{ _cf_payload.t }}"

- name: Ensure cloudflared config directory exists
  file:
    path: "{{ docker_dir }}/cloudflared"
    state: directory
    mode: '0755'

- name: Deploy tunnel credentials file
  copy:
    content: "{{ {'AccountTag': _cf_account_id, 'TunnelSecret': _cf_payload.s, 'TunnelID': _cf_tunnel_id} | to_json }}\n"
    dest: "{{ docker_dir }}/cloudflared/creds.json"
    mode: '0644'

- name: Read existing cloudflared config
  slurp:
    src: "{{ docker_dir }}/cloudflared/config.yml"
  register: _cf_existing_raw
  ignore_errors: true

- name: Set static hostname list
  set_fact:
    _cf_static_hostnames:
      - "{{ domain }}"
      - "{{ authelia.subdomain }}.{{ domain }}"
      - "{{ portainer.subdomain }}.{{ domain }}"
      - "{{ headscale.subdomain }}.{{ domain }}"
      - "{{ headscale_ui.subdomain }}.{{ domain }}"

- name: Extract custom ingress entries from existing config
  set_fact:
    _cf_custom_ingress: >-
      {{ (((_cf_existing_raw.content | b64decode | from_yaml).ingress | default([]))
          | selectattr('hostname', 'defined')
          | rejectattr('hostname', 'in', _cf_static_hostnames)
          | list)
         if _cf_existing_raw is not failed else [] }}

- name: Deploy cloudflared config
  template:
    src: config.yml.j2
    dest: "{{ docker_dir }}/cloudflared/config.yml"
    mode: '0644'

- name: Make sure the cloudflared container is created and running
  docker_container:
    name: cloudflared
    image: cloudflare/cloudflared:latest
    pull: yes
    networks:
      - name: docker_network
        ipv4_address: "{{ cloudflared.docker_address }}"
    volumes:
      - "{{ docker_dir }}/cloudflared:/etc/cloudflared:ro"
    command: tunnel --no-autoupdate run
    state: started
    restart: yes
    restart_policy: unless-stopped
