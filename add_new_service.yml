---
# ansible-playbook add_new_service.yml -e service_url=http://192.168.1.86 -e subdomain=octoprint [-e authelia_protected=true] [-e streaming=true]
# streaming=true disables response buffering, for services that use server-sent events (proxy.conf's 240s read timeout still applies).
- name: Add new service to reverse proxy
  hosts: server
  become: true

  vars_files:
    - secret.yml

  pre_tasks:
    - name: Verify required variables
      assert:
        that:
          - subdomain is defined
          - service_url is defined
        fail_msg: "Missing required variables. Need: subdomain and service_url"

    - name: Validate URL format
      assert:
        that:
          - service_url is match('^(http|https)://.+')
        fail_msg: "URL must start with http:// or https://"

  tasks:
    - name: "Parse host and port from {{ service_url }}"
      set_fact:
        service_host: "{{ service_url | regex_replace('^(.*://)?([^:/]+).*$', '\\2') }}"
        service_port: "{{ (service_url | regex_search('://[^/]+:([0-9]+)', '\\1') or ['80'])[0] }}"

    - name: Check if configuration file exists
      stat:
        path: "{{ docker_dir }}/swag/nginx/proxy-confs/{{ subdomain }}.subdomain.conf"
      register: config_file

    - name: Backup existing configuration
      copy:
        src: "{{ docker_dir }}/swag/nginx/proxy-confs/{{ subdomain }}.subdomain.conf"
        dest: "{{ docker_dir }}/swag/nginx/proxy-confs/{{ subdomain }}.subdomain.conf.bak"
        remote_src: yes
      when: config_file.stat.exists

    - name: "Create proxy-conf for {{ subdomain }}"
      copy:
        content: |
          {% if authelia_protected | default(false) | bool %}
          include /config/nginx/snippets/authelia-location.conf;
          {% endif %}
          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              http2 on;

              server_name {{ subdomain }}.*;

              include /config/nginx/ssl.conf;

              client_max_body_size 0;

              location / {
                  include /config/nginx/proxy.conf;
                  include /config/nginx/resolver.conf;
          {% if authelia_protected | default(false) | bool %}
                  include /config/nginx/snippets/authelia-authrequest.conf;
          {% endif %}
                  set $upstream_app {{ service_host }};
                  set $upstream_port {{ service_port }};
                  set $upstream_proto http;
                  proxy_pass $upstream_proto://$upstream_app:$upstream_port;
          {% if streaming | default(false) | bool %}
                  proxy_buffering off;
          {% endif %}

                  allow {{ local_ip_range }};
                  allow {{ tailscale_ip_range }};
                  deny all;
              }
          }
        dest: "{{ docker_dir }}/swag/nginx/proxy-confs/{{ subdomain }}.subdomain.conf"

    - name: Reload swag
      include_tasks: tasks/reload_swag.yml

    - debug: msg="{{ subdomain }} service created - https://{{ subdomain }}.{{ domain }}"
