---
# Ensures a single hostname is present or absent in the Cloudflare tunnel ingress.
# Required vars:
#   cf_action:    "ensure_present" | "ensure_absent"
#   cf_subdomain: subdomain string (e.g. "portainer")
# Optional:
#   cf_service:   upstream URL (default: https://swag:443)

- name: Decode Cloudflare tunnel token
  set_fact:
    _cf_payload: >-
      {{ (cloudflare_tunnel_token.split('.')[1]
          | replace('-', '+') | replace('_', '/')
          + '==') | b64decode | from_json }}

- name: Set account and tunnel IDs from token
  set_fact:
    _cf_account_id: "{{ _cf_payload.a }}"
    _cf_tunnel_id: "{{ _cf_payload.t }}"

- name: Fetch current tunnel ingress configuration
  uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ _cf_account_id }}/cfdtunnel/{{ _cf_tunnel_id }}/configurations"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    status_code: 200
  register: _cf_config
  delegate_to: localhost

- name: Compute ingress without target hostname
  set_fact:
    _cf_hostname: "{{ cf_subdomain }}.{{ domain }}"
    _cf_others: >-
      {{ (_cf_config.json.result.config.ingress | default([]))
         | selectattr('hostname', 'defined')
         | rejectattr('hostname', 'equalto', cf_subdomain + '.' + domain)
         | list }}

- name: Build ingress with hostname present
  when: cf_action == 'ensure_present'
  set_fact:
    _cf_new_ingress: >-
      {{ [{'hostname': _cf_hostname,
           'service': cf_service | default('https://swag:443'),
           'originRequest': {'noTLSVerify': true}}]
         + _cf_others
         + [{'service': 'http_status:404'}] }}

- name: Build ingress with hostname absent
  when: cf_action == 'ensure_absent'
  set_fact:
    _cf_new_ingress: "{{ _cf_others + [{'service': 'http_status:404'}] }}"

- name: Apply updated tunnel ingress configuration
  uri:
    url: "https://api.cloudflare.com/client/v4/accounts/{{ _cf_account_id }}/cfdtunnel/{{ _cf_tunnel_id }}/configurations"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      config:
        ingress: "{{ _cf_new_ingress }}"
    status_code: 200
  delegate_to: localhost
