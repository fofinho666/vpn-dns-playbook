---
# Ensures a single hostname is present or absent in the cloudflared local config.
# Required vars:
#   cf_action:    "ensure_present" | "ensure_absent"
#   cf_subdomain: subdomain string (e.g. "portainer")
# Optional:
#   cf_service:   upstream URL (default: https://swag:443)

- name: Decode Cloudflare tunnel token
  set_fact:
    _cf_payload: >-
      {{ cloudflare_tunnel_token
         | regex_replace('^[^.]+\.([^.]+).*$', '\1')
         | replace('-', '+') | replace('_', '/')
         | b64decode | from_json }}

- name: Set tunnel ID from token
  set_fact:
    _cf_tunnel_id: "{{ _cf_payload.t }}"

- name: Set target hostname
  set_fact:
    _cf_hostname: "{{ cf_subdomain }}.{{ domain }}"

- name: Read existing cloudflared config
  slurp:
    src: "{{ docker_dir }}/cloudflared/config.yml"
  register: _cf_existing_raw

- name: Parse existing config
  set_fact:
    _cf_existing_config: "{{ _cf_existing_raw.content | b64decode | from_yaml }}"

- name: Set static hostname list
  set_fact:
    _cf_static_hostnames:
      - "{{ domain }}"
      - "{{ authelia.subdomain }}.{{ domain }}"
      - "{{ portainer.subdomain }}.{{ domain }}"
      - "{{ wireguard.subdomain }}.{{ domain }}"

- name: Build custom ingress with hostname present
  when: cf_action == 'ensure_present'
  set_fact:
    _cf_custom_ingress: >-
      {{ [{'hostname': _cf_hostname,
           'service': cf_service | default('https://swag:443'),
           'originRequest': {'noTLSVerify': true}}]
         + ((_cf_existing_config.ingress | default([]))
            | selectattr('hostname', 'defined')
            | rejectattr('hostname', 'equalto', _cf_hostname)
            | rejectattr('hostname', 'in', _cf_static_hostnames)
            | list) }}

- name: Build custom ingress with hostname absent
  when: cf_action == 'ensure_absent'
  set_fact:
    _cf_custom_ingress: >-
      {{ (_cf_existing_config.ingress | default([]))
         | selectattr('hostname', 'defined')
         | rejectattr('hostname', 'equalto', _cf_hostname)
         | rejectattr('hostname', 'in', _cf_static_hostnames)
         | list }}

- name: Deploy updated cloudflared config
  template:
    src: "{{ playbook_dir }}/roles/cloudflared/templates/config.yml.j2"
    dest: "{{ docker_dir }}/cloudflared/config.yml"
    mode: '0644'

- name: Restart cloudflared to apply new config
  docker_container:
    name: cloudflared
    state: started
    restart: yes

- name: Look up Cloudflare zone ID
  uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ domain }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    status_code: 200
  register: _cf_zones
  delegate_to: localhost

- name: Set Cloudflare zone ID
  set_fact:
    _cf_zone_id: "{{ _cf_zones.json.result | map(attribute='id') | first }}"

- name: Check if CNAME record already exists
  uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ _cf_zone_id }}/dns_records?type=CNAME&name={{ _cf_hostname }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    status_code: 200
  register: _cf_dns_check
  delegate_to: localhost

- name: Create CNAME record for new hostname
  when: cf_action == 'ensure_present' and (_cf_dns_check.json.result | length) == 0
  uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ _cf_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: CNAME
      name: "{{ _cf_hostname }}"
      content: "{{ _cf_tunnel_id }}.cfargotunnel.com"
      proxied: true
    status_code: 200
  delegate_to: localhost

- name: Delete CNAME record for removed hostname
  when: cf_action == 'ensure_absent' and (_cf_dns_check.json.result | length) > 0
  uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ _cf_zone_id }}/dns_records/{{ _cf_dns_check.json.result | map(attribute='id') | first }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ cloudflare_api_token }}"
    status_code: 200
  delegate_to: localhost
