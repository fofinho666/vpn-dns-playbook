---
all:
  hosts:
    server:
      ansible_host: "{{ host }}"
      ansible_user: "{{ user}}"
    vps:
      ansible_host: "{{ vps_host }}"
      ansible_user: "{{ vps_user }}"
      ansible_ssh_pass: ""
      ansible_password: ""
      ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  vars:
    timestamp: "{{ ansible_date_time.date }} {{ ansible_date_time.time }}"

    docker_users:
      - "{{ user}}"

    docker_dir: /opt/docker

    # docker_network
    docker_ip_range: 10.8.2.0/24
    docker_network_subnet: "{{ docker_ip_range }}"
    docker_gateway: 10.8.2.1

    local_ip_range: 192.168.0.0/16
    tailscale_ip_range: 100.64.0.0/10

    # services:
    redis:
      docker_address: 10.8.2.3
    authelia:
      docker_address: 10.8.2.4
      subdomain: auth
      forward_host: authelia
      forward_port: 9091
    swag:
      docker_address: 10.8.2.5
    portainer:
      docker_address: 10.8.2.7
      subdomain: portainer
      forward_host: portainer
      forward_port: 9000
    headscale:
      docker_address: 10.8.2.6
      subdomain: "{{ headscale_subdomain }}"
      forward_host: headscale
      forward_port: 8080
    headscale_ui:
      docker_address: 10.8.2.11
      subdomain: headscale
      forward_host: headscale-ui
      forward_port: 8080
    homer:
      docker_address: 10.8.2.8
      subdomain: "{{ domain }}"
      forward_host: homer
      forward_port: 8080
      config_file: "{{ user_home }}/homer/config.yml"
    webssh:
      docker_address: 10.8.2.12
      subdomain: "{{ webssh_subdomain }}"
      forward_host: webssh
      forward_port: 3000
    # It can be "quad9" "google" or "cloudflare"
    dns_nameservers: cloudflare
    dns_server: 1.1.1.1

    http_port: "80"
    https_port: "443"

    ufw_ports:
      - port: "{{ http_port }}"
        proto: tcp
      - port: "{{ https_port }}"
        proto: tcp
      - port: "{{ ssh_port }}"
        proto: tcp
