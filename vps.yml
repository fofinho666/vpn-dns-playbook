---
- name: Setup VPS (Headscale raw-TCP relay)
  hosts: vps
  become: true
  vars_files:
    - secret.yml

  pre_tasks:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
      tags:
        - always

  roles:
    - role: vps_relay
      tags:
        - vps_relay

    - role: unattended_upgrades
      tags:
        - unattended_upgrades

    - role: ufw
      vars:
        ufw_rescue_port: "{{ vps_ssh_port }}"
        ufw_ports:
          - port: "443"
            proto: tcp
          - port: "{{ vps_ssh_port }}"
            proto: tcp
      tags:
        - ufw

    - role: fail2ban
      vars:
        fail2ban_sshd_port: "{{ vps_ssh_port }}"
      tags:
        - fail2ban
