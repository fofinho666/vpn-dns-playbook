---
- name: Setup vpn
  hosts: server
  become: true
  vars_files:
    - secret.yml

  pre_tasks:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
      tags:
        - always

    - name: Get User and Group IDs
      getent:
        database: passwd
      tags:
        - always

    - name: Set User and Group IDs as facts
      set_fact:
        uid: "{{ ansible_facts['getent_passwd'][user][1] }}"
        gid: "{{ ansible_facts['getent_passwd'][user][2] }}"
        user_home: "{{ ansible_facts['getent_passwd'][user][4] }}"
      tags:
        - always

  roles:
    - role: docker
      tags:
        - docker

    - role: unattended_upgrades
      tags:
        - unattended_upgrades

    - role: ufw
      tags:
        - ufw

    - role: fail2ban
      tags:
        - fail2ban

    - role: headscale
      tags:
        - headscale

    - role: portainer
      tags:
        - portainer

    - role: webssh
      tags:
        - webssh

    - role: authelia
      tags:
        - authelia

    - role: swag
      tags:
        - swag

    - role: reverse_tunnel
      tags:
        - reverse_tunnel

    - role: tunnel_monitor
      tags:
        - tunnel_monitor

    # Must run after swag: connects to https://headscale.<domain>
    - role: tailscale
      tags:
        - tailscale

    # Must run after tailscale: dnsmasq binds to the Tailscale IP
    - role: dns_relay
      tags:
        - dns_relay

    - role: homer
      tags:
        - homer